  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n  <style>/* ============================================================\n   STOP — Color tokens\n   Navy + sky-blue + cream. A confident, high-contrast palette:\n   deep navy ink, a bright \"tooth blue\" accent, warm cream paper.\n   ============================================================ */\n:root {\n  /* --- Navy (ink / dark surfaces) --- */\n  --navy:        #0A1530;   /* primary ink + dark sections */\n  --navy-2:      #0F1E3F;   /* raised dark surface */\n  --navy-3:      #16294F;   /* hover dark surface */\n  --navy-line:   #25375E;   /* hairline on dark */\n\n  /* --- Blue (tooth blue — secondary) --- */\n  --blue:        #2D8DCB;   /* tooth blue, brightened */\n  --blue-2:      #1F7AB8;   /* logo blue, deeper — shadows / borders */\n  --blue-soft:   #0E69A3;   /* pressed / deep */\n  --blue-100:    #E6F0F9;   /* light blue tint */\n\n  /* --- Accent (the bright \"action\" blue) --- */\n  --accent:      #3FB6FF;   /* bright sky blue — primary CTA on navy */\n  --accent-2:    #1F7AB8;   /* deeper, for the hard 3D drop-shadow */\n  --accent-soft: #D6EDFF;   /* light accent tint */\n\n  /* --- Paper (cream / light surfaces) --- */\n  --cream:       #FBF7EE;   /* page background */\n  --cream-2:     #F2EBDA;   /* alternating section */\n  --line:        #E4DBC7;   /* hairline on cream */\n\n  /* --- Text --- */\n  --ink:         #0A1530;   /* body + headings */\n  --ink-soft:    #344266;   /* secondary text */\n  --muted:       #6C7798;   /* captions / meta */\n\n  /* --- Semantic --- */\n  --red:         #E0594B;   /* error / \"não é pra você\" */\n  --green:       #1E8A5A;   /* success / confirmations */\n  --whatsapp:    #1FA855;   /* WhatsApp green */\n  --whatsapp-2:  #157A3C;   /* WhatsApp shadow */\n\n  /* --- Semantic surface aliases --- */\n  --bg-page:        var(--cream);\n  --bg-alt:         var(--cream-2);\n  --bg-dark:        var(--navy);\n  --surface-card:   #ffffff;\n  --surface-dark:   var(--navy-2);\n  --border-strong:  var(--ink);     /* the 1.5–3px neo-brutalist border */\n  --border-hair:    var(--line);\n  --text-body:      var(--ink-soft);\n  --text-heading:   var(--ink);\n  --text-muted:     var(--muted);\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   STOP — Typography tokens\n   Display set is tight, slightly condensed Bricolage Grotesque.\n   Body is Manrope. Eyebrows/meta are uppercase JetBrains Mono.\n   ============================================================ */\n:root {\n  /* --- Families --- */\n  --font-display: \"Bricolage Grotesque\", -apple-system, BlinkMacSystemFont, sans-serif;\n  --font-sans:    \"Manrope\", -apple-system, BlinkMacSystemFont, sans-serif;\n  --font-mono:    \"JetBrains Mono\", ui-monospace, SFMono-Regular, monospace;\n\n  /* --- Display weights / tracking --- */\n  --display-weight:  700;\n  --display-tracking: -0.03em;   /* tight */\n  --display-stretch:  90%;       /* slightly condensed */\n  --display-leading:  1.02;\n\n  /* --- Display sizes (clamp, fluid) --- */\n  --display-xl: clamp(34px, 6vw,   82px); /* @kind font */\n  --display-lg: clamp(40px, 5.4vw, 72px); /* @kind font */\n  --display-md: clamp(32px, 4vw,   54px); /* @kind font */\n  --display-sm: clamp(24px, 2.6vw, 36px); /* @kind font */\n\n  /* --- Body --- */\n  --text-base:  17px;\n  --leading-body: 1.55;\n  --lead-size:  clamp(17px, 1.6vw, 21px);\n\n  /* --- Eyebrow / mono meta --- */\n  --eyebrow-size:     11.5px;\n  --eyebrow-tracking: 0.18em;\n  --meta-size:        12.5px;\n  --meta-tracking:    0.08em;\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   STOP — Spacing, radii & layout tokens\n   ============================================================ */\n:root {\n  /* --- Spacing scale --- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n\n  /* --- Section rhythm --- */\n  --section-y: clamp(64px, 8vw, 110px); /* @kind spacing */\n\n  /* --- Containers --- */\n  --wrap:     1180px;\n  --wrap-md:  1020px;\n  --wrap-sm:  880px;\n  --wrap-pad: 32px;\n\n  /* --- Radii --- */\n  --radius-sm:   6px;\n  --radius-md:   10px;\n  --radius-lg:   14px;   /* buttons */\n  --radius-xl:   20px;   /* cards */\n  --radius-2xl:  24px;   /* big cards */\n  --radius-pill: 999px;  /* chips / badges */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   STOP — Borders, shadows & motion\n   The signature is the \"hard\" neo-brutalist offset shadow:\n   a solid ink block with NO blur, paired with a thick ink border.\n   Buttons use a stacked 3D drop (\"0 4px 0\") that compresses on press.\n   ============================================================ */\n:root {\n  /* --- Borders --- */\n  --border-w:        2px;       /* default neo-brutalist border */\n  --border-w-thin:   1.5px;\n  --border-w-thick:  3px;\n  --border-ink:      2px solid var(--ink);\n\n  /* --- Hard offset shadows (no blur) --- */\n  --shadow-hard-sm:  4px 4px 0 0 var(--ink);\n  --shadow-hard:     6px 6px 0 0 var(--ink);\n  --shadow-hard-lg:  8px 8px 0 0 var(--ink);\n  --shadow-hard-xl:  10px 10px 0 0 var(--ink);\n\n  /* --- Button 3D stack (color block + ambient glow) --- */\n  --btn-stack-accent:       0 4px 0 var(--accent-2), 0 10px 30px -10px rgba(63,182,255,.5);\n  --btn-stack-accent-hover: 0 6px 0 var(--accent-2), 0 16px 36px -10px rgba(63,182,255,.6);\n  --btn-stack-accent-press: 0 2px 0 var(--accent-2);\n  --btn-stack-navy:         0 4px 0 #000, 0 10px 30px -10px rgba(10,21,48,.5);\n\n  /* --- Soft shadows (dark sections / floating media) --- */\n  --shadow-soft:   0 18px 40px -20px rgba(0,0,0,.5);\n  --shadow-float:  0 40px 90px -40px rgba(0,0,0,.75);\n\n  /* --- Focus ring --- */\n  --focus-ring: 0 0 0 3px rgba(31,122,184,.16);\n\n  /* --- Motion --- */\n  --ease:         cubic-bezier(.2,.7,.3,1); /* @kind other */\n  --dur-fast:     .12s; /* @kind other */\n  --dur:          .2s; /* @kind other */\n  --lift:         translateY(-2px); /* @kind other */ /* hover lift on buttons */\n}\n<\u002Fstyle>\n  <style>/* ============================================================\n   STOP Design System — global entry point\n   Consumers link THIS file. It is a manifest of @imports only.\n   ============================================================ */\n/* ============================================================\n   STOP — Webfonts\n   All three families are Google Fonts (no substitution needed):\n   - Bricolage Grotesque  → display / headlines (variable, opsz)\n   - Manrope              → body / UI / buttons\n   - JetBrains Mono       → eyebrows, meta, numeric labels\n   ============================================================ */\n/* vietnamese */\n@font-face {\n  font-family: 'Bricolage Grotesque';\n  font-style: normal;\n  font-weight: 200 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"06d38396-976c-467f-9e9d-7d127e55e28b\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Bricolage Grotesque';\n  font-style: normal;\n  font-weight: 200 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"67c51c3b-7f66-426c-a69b-8fb8518f783b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Bricolage Grotesque';\n  font-style: normal;\n  font-weight: 200 800;\ , U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"5e6e55e2-5fe5-4106-aa78-496b189c5ed1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   STOP — Color tokens\n   Navy + sky-blue + cream. A confident, high-contrast palette:\n   deep navy ink, a bright \"tooth blue\" accent, warm cream paper.\n   ============================================================ */\n:root {\n  /* --- Navy (ink / dark surfaces) --- */\n  --navy:        #0A1530;   /* primary ink + dark sections */\n  --navy-2:      #0F1E3F;   /* raised dark surface */\n  --navy-3:      #16294F;   /* hover dark surface */\n  --navy-line:   #25375E;   /* hairline on dark */\n\n  /* --- Blue (tooth blue — secondary) --- */\n  --blue:        #2D8DCB;   /* tooth blue, brightened */\n  --blue-2:      #1F7AB8;   /* logo blue, deeper — shadows / borders */\n  --blue-soft:   #0E69A3;   /* pressed / deep */\n  --blue-100:    #E6F0F9;   /* light blue tint */\n\n  /* --- Accent (the bright \"action\" blue) --- */\n  --accent:      #3FB6FF;   /* bright sky blue — primary CTA on navy */\n  --accent-2:    #1F7AB8;   /* deeper, for the hard 3D drop-shadow */\n  --accent-soft: #D6EDFF;   /* light accent tint */\n\n  /* --- Paper (cream / light surfaces) --- */\n  --cream:       #FBF7EE;   /* page background */\n  --cream-2:     #F2EBDA;   /* alternating section */\n  --line:        #E4DBC7;   /* hairline on cream */\n\n  /* --- Text --- */\n  --ink:         #0A1530;   /* body + headings */\n  --ink-soft:    #344266;   /* secondary text */\n  --muted:       #6C7798;   /* captions / meta */\n\n  /* --- Semantic --- */\n  --red:         #E0594B;   /* error / \"não é pra você\" */\n  --green:       #1E8A5A;   /* success / confirmations */\n  --whatsapp:    #1FA855;   /* WhatsApp green */\n  --whatsapp-2:  #157A3C;   /* WhatsApp shadow */\n\n  /* --- Semantic surface aliases --- */\n  --bg-page:        var(--cream);\n  --bg-alt:         var(--cream-2);\n  --bg-dark:        var(--navy);\n  --surface-card:   #ffffff;\n  --surface-dark:   var(--navy-2);\n  --border-strong:  var(--ink);     /* the 1.5–3px neo-brutalist border */\n  --border-hair:    var(--line);\n  --text-body:      var(--ink-soft);\n  --text-heading:   var(--ink);\n  --text-muted:     var(--muted);\n}\n\n/* ============================================================\n   STOP — Typography tokens\n   Display set is tight, slightly condensed Bricolage Grotesque.\n   Body is Manrope. Eyebrows/meta are uppercase JetBrains Mono.\n   ============================================================ */\n:root {\n  /* --- Families --- */\n  --font-display: \"Bricolage Grotesque\", -apple-system, BlinkMacSystemFont, sans-serif;\n  --font-sans:    \"Manrope\", -apple-system, BlinkMacSystemFont, sans-serif;\n  --font-mono:    \"JetBrains Mono\", ui-monospace, SFMono-Regular, monospace;\n\n  /* --- Display weights / tracking --- */\n  --display-weight:  700;\n  --display-tracking: -0.03em;   /* tight */\n  --display-stretch:  90%;       /* slightly condensed */\n  --display-leading:  1.02;\n\n  /* --- Display sizes (clamp, fluid) --- */\n  --display-xl: clamp(34px, 6vw,   82px); /* @kind font */\n  --display-lg: clamp(40px, 5.4vw, 72px); /* @kind font */\n  --display-md: clamp(32px, 4vw,   54px); /* @kind font */\n  --display-sm: clamp(24px, 2.6vw, 36px); /* @kind font */\n\n  /* --- Body --- */\n  --text-base:  17px;\n  --leading-body: 1.55;\n  --lead-size:  clamp(17px, 1.6vw, 21px);\n\n  /* --- Eyebrow / mono meta --- */\n  --eyebrow-size:     11.5px;\n  --eyebrow-tracking: 0.18em;\n  --meta-size:        12.5px;\n  --meta-tracking:    0.08em;\n}\n\n/* ============================================================\n   STOP — Spacing, radii & layout tokens\n   ============================================================ */\n:root {\n  /* --- Spacing scale --- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n\n  /* --- Section rhythm --- */\n  --section-y: clamp(64px, 8vw, 110px); /* @kind spacing */\n\n  /* --- Containers --- */\n  --wrap:     1180px;\n  --wrap-md:  1020px;\n  --wrap-sm:  880px;\n  --wrap-pad: 32px;\n\n  /* --- Radii --- */\n  --radius-sm:   6px;\n  --radius-md:   10px;\n  --radius-lg:   14px;   /* buttons */\n  --radius-xl:   20px;   /* cards */\n  --radius-2xl:  24px;   /* big cards */\n  --radius-pill: 999px;  /* chips / badges */\n}\n\n/* ============================================================\n   STOP — Borders, shadows & motion\n   The signature is the \"hard\" neo-brutalist offset shadow:\n   a solid ink block with NO blur, paired with a thick ink border.\n   Buttons use a stacked 3D drop (\"0 4px 0\") that compresses on press.\n   ============================================================ */\n:root {\n  /* --- Borders --- */\n  --border-w:        2px;       /* default neo-brutalist border */\n  --border-w-thin:   1.5px;\n  --border-w-thick:  3px;\n  --border-ink:      2px solid var(--ink);\n\n  /* --- Hard offset shadows (no blur) --- */\n  --shadow-hard-sm:  4px 4px 0 0 var(--ink);\n  --shadow-hard:     6px 6px 0 0 var(--ink);\n  --shadow-hard-lg:  8px 8px 0 0 var(--ink);\n  --shadow-hard-xl:  10px 10px 0 0 var(--ink);\n\n  /* --- Button 3D stack (color block + ambient glow) --- */\n  --btn-stack-accent:       0 4px 0 var(--accent-2), 0 10px 30px -10px rgba(63,182,255,.5);\n  --btn-stack-accent-hover: 0 6px 0 var(--accent-2), 0 16px 36px -10px rgba(63,182,255,.6);\n  --btn-stack-accent-press: 0 2px 0 var(--accent-2);\n  --btn-stack-navy:         0 4px 0 #000, 0 10px 30px -10px rgba(10,21,48,.5);\n\n  /* --- Soft shadows (dark sections / floating media) --- */\n  --shadow-soft:   0 18px 40px -20px rgba(0,0,0,.5);\n  --shadow-float:  0 40px 90px -40px rgba(0,0,0,.75);\n\n  /* --- Focus ring --- */\n  --focus-ring: 0 0 0 3px rgba(31,122,184,.16);\n\n  /* --- Motion --- */\n  --ease:         cubic-bezier(.2,.7,.3,1); /* @kind other */\n  --dur-fast:     .12s; /* @kind other */\n  --dur:          .2s; /* @kind other */\n  --lift:         translateY(-2px); /* @kind other */ /* hover lift on buttons */\n}\n\n<\u002Fstyle>\n  <script src=\"b5d1f22b-975e-4a64-a587-0b7444bf4d0a\"><\u002Fscript>\n  <style>\n    * { box-sizing: border-box; }\n    html, body { margin: 0; padding: 0; }\n    body { font-family: var(--font-sans); background: var(--cream); color: var(--ink); }\n    a { color: var(--accent); text-decoration: none; }\n    a:hover { color: var(--blue-2); }\n    @keyframes rs-tick { to { transform: translateX(-50%); } }\n    @keyframes rs-pulse { 0% { box-shadow: 0 0 0 0 rgba(63,182,255,.45); } 70% { box-shadow: 0 0 0 16px rgba(63,182,255,0); } 100% { box-shadow: 0 0 0 0 rgba(63,182,255,0); } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:100vw;overflow-x:hidden;\">\n\n  <!-- TICKER -->\n  <div style=\"background:var(--navy);color:#fff;padding:11px 0;overflow:hidden;border-bottom:1px solid var(--navy-line);\">\n    <div style=\"display:flex;gap:48px;width:max-content;animation:rs-tick 26s linear infinite;\">\n      <sc-for list=\"{{ tickerItems2x }}\" as=\"t\" hint-placeholder-count=\"12\">\n        <span style=\"display:inline-flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.85);white-space:nowrap;\">\n          <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Icon\" name=\"check\" size=\"12\" hint-size=\"12px,12px\" style=\"color:var(--accent)\"><\u002Fx-import>\n          {{ t }}\n        <\u002Fspan>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- NAV -->\n  <header style=\"position:sticky;top:0;z-index:50;background:rgba(251,247,238,.9);backdrop-filter:saturate(150%) blur(12px);border-bottom:1px solid var(--line);\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:72px;\">\n      <a href=\"#top\" style=\"font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-0.02em;color:var(--ink);\">Reinvent <span style=\"color:var(--accent);\">Sorrisos<\u002Fspan><\u002Fa>\n      <div style=\"display:flex;align-items:center;gap:16px;\">\n        <a href=\"{{ whatsappHref }}\" style=\"display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);font-weight:600;white-space:nowrap;\" target=\"_blank\" rel=\"noopener\">\n          <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Icon\" name=\"whatsapp\" size=\"16\" hint-size=\"16px,16px\" style=\"color:var(--whatsapp)\"><\u002Fx-import>\n          {{ whatsappDisplay }}\n        <\u002Fa>\n        <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Button\" as=\"a\" href=\"#cadastro\" variant=\"accent\" size=\"sm\" hint-size=\"auto,40px\">Quero atender agora<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section id=\"top\" style=\"background:var(--navy);color:#fff;padding:64px 0 90px;position:relative;overflow:hidden;\">\n    <div style=\"position:absolute;inset:0;background-image:radial-gradient(circle at 18% 20%, rgba(45,141,203,.22), transparent 50%), radial-gradient(circle at 82% 85%, rgba(63,182,255,.14), transparent 50%);pointer-events:none;\"><\u002Fdiv>\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 32px;position:relative;display:grid;grid-template-columns:1.1fr 0.9fr;gap:56px;align-items:start;\">\n      <div>\n        <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Eyebrow\" tone=\"light\" hint-size=\"auto,20px\"><span style=\"color:var(--accent);\">Consultório pronto pra recém-formados<\u002Fspan><\u002Fx-import>\n        <h1 style=\"font-family:var(--font-display);font-weight:700;font-stretch:90%;letter-spacing:-0.03em;line-height:1.05;font-size:clamp(34px,5vw,58px);margin:18px 0 0;max-width:18ch;color:#fff;\">\n          Recém-formado sem consultório? <span style=\"color:var(--accent);\">A gente resolve isso.<\u002Fspan>\n        <\u002Fh1>\n        <p style=\"margin:24px 0 0;font-size:clamp(17px,1.6vw,20px);line-height:1.55;color:rgba(255,255,255,.82);max-width:52ch;\">\n          Estrutura completa, materiais inclusos e localização nobre — você paga só R$170 por atendimento, sem aluguel, sem contrato, sem investir nada antes.\n        <\u002Fp>\n        <div style=\"margin-top:36px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;\">\n          <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Button\" as=\"a\" href=\"#cadastro\" variant=\"accent\" size=\"xl\" icon=\"arrow\" hint-size=\"auto,60px\">Quero atender agora<\u002Fx-import>\n        <\u002Fdiv>\n        <p style=\"margin-top:14px;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);\">\n          Sem mensalidade · Pague só quando atender\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div id=\"cadastro\" style=\"scroll-margin-top:90px;\">\n        <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Card\" tone=\"paper\" border=\"thick\" shadow=\"xl\" radius=\"2xl\" hint-size=\"100%,auto\" style=\"padding:30px 30px 28px;\">\n          <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"text-align:center;padding:20px 0;\">\n              <div style=\"width:56px;height:56px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;\">\n                <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Icon\" name=\"check\" size=\"26\" hint-size=\"26px,26px\" style=\"color:#fff\"><\u002Fx-import>\n              <\u002Fdiv>\n              <p style=\"font-family:var(--font-display);font-weight:700;font-size:22px;margin:0 0 8px;color:var(--ink);\">Cadastro recebido!<\u002Fp>\n              <p style=\"margin:0;color:var(--ink-soft);font-size:15px;\">Vamos te chamar no WhatsApp pra combinar seu primeiro horário.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ notSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Eyebrow\" tone=\"ink\" dot=\"{{ true }}\" hint-size=\"auto,18px\">Comece agora<\u002Fx-import>\n              <p style=\"font-family:var(--font-display);font-weight:700;font-size:22px;margin:14px 0 20px;color:var(--ink);\">Garanta seu primeiro atendimento<\u002Fp>\n              <form style=\"display:flex;flex-direction:column;gap:16px;\" sc-camel-on-submit=\"{{ handleSubmit }}\">\n                <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Input\" label=\"Nome completo\" placeholder=\"Seu nome\" value=\"{{ name }}\" sc-camel-on-change=\"{{ onNameChange }}\" required=\"{{ true }}\" hint-size=\"100%,66px\"><\u002Fx-import>\n                <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Input\" label=\"WhatsApp\" placeholder=\"(00) 00000-0000\" value=\"{{ whatsapp }}\" sc-camel-on-change=\"{{ onWhatsappChange }}\" required=\"{{ true }}\" hint-size=\"100%,66px\"><\u002Fx-import>\n\n                <div>\n                  <div style=\"font-size:13px;font-weight:700;color:var(--ink);margin-bottom:9px;\">Já deu entrada no CRO?<\u002Fdiv>\n                  <div style=\"display:flex;gap:10px;\">\n                    <sc-for list=\"{{ croOptions }}\" as=\"opt\" hint-placeholder-count=\"2\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ opt.select }}\" style=\"flex:1;padding:11px 14px;border-radius:var(--radius-md);font-family:var(--font-sans);font-size:14px;font-weight:700;cursor:pointer;border:1.5px solid var(--ink);background:{{ opt.bg }};color:{{ opt.color }};\">{{ opt.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <label style=\"display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ink-soft);line-height:1.45;cursor:pointer;\">\n                  <input type=\"checkbox\" checked=\"{{ consent }}\" sc-camel-on-change=\"{{ onConsentChange }}\" required=\"{{ true }}\" style=\"margin-top:2px;flex-shrink:0;width:16px;height:16px;accent-color:var(--accent-2);\">\n                  Ao se inscrever, você concorda com nossa Política de Privacidade e com o tratamento dos seus dados conforme a LGPD.\n                <\u002Flabel>\n\n                <sc-if value=\"{{ sendError }}\" hint-placeholder-val=\"{{ false }}\">\n                  <p style=\"margin:0;font-size:12.5px;color:var(--red);font-weight:600;\">Não conseguimos enviar agora. Tente de novo ou fale direto pelo WhatsApp.<\u002Fp>\n                <\u002Fsc-if>\n\n                <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Button\" as=\"button\" type=\"submit\" variant=\"accent\" size=\"md\" disabled=\"{{ sending }}\" hint-size=\"100%,58px\" style=\"width:100%;\">{{ submitLabel }}<\u002Fx-import>\n              <\u002Fform>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ABERTURA / PROPOSTA DE VALOR -->\n  <section style=\"padding:var(--section-y) 0;\">\n    <div style=\"max-width:820px;margin:0 auto;padding:0 32px;\">\n      <p style=\"font-family:var(--font-display);font-weight:700;font-stretch:90%;letter-spacing:-0.02em;line-height:1.3;font-size:clamp(22px,2.4vw,30px);margin:0 0 18px;color:var(--ink);\">\n        Você acabou de tirar o CRO. Quer atender e ganhar experiência clínica — mas não tem consultório, dinheiro pra montar um, ou paciente recorrente que justifique aluguel de sala.\n      <\u002Fp>\n      <p style=\"font-size:17px;line-height:1.6;color:var(--ink-soft);margin:0;\">A gente entrega tudo pronto: materiais, equipamentos, estrutura. Você só traz o paciente. Sem aluguel, sem contrato — paga <strong style=\"color:var(--ink);\">R$170<\u002Fstrong> por profilaxia atendida e cobra o que quiser do seu paciente.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- IDENTIFICAÇÃO DA DOR -->\n  <section style=\"padding:var(--section-y) 0;background:var(--cream-2);\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 32px;display:grid;grid-template-columns:0.85fr 1.15fr;gap:40px;align-items:start;\">\n      <div>\n        <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Eyebrow\" hint-size=\"auto,18px\">Isso é familiar?<\u002Fx-import>\n        <h2 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(26px,3vw,36px);margin:14px 0 0;line-height:1.15;color:var(--ink);\">\n          Ser recém-formado é isso: diploma na mão, vontade de atender, e nenhum lugar pra colocar isso em prática.\n        <\u002Fh2>\n      <\u002Fdiv>\n      <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;\">\n        <sc-for list=\"{{ painQuestions }}\" as=\"q\" hint-placeholder-count=\"5\">\n          <li style=\"display:flex;gap:14px;align-items:flex-start;font-size:16.5px;color:var(--ink-soft);background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;\">\n            <span style=\"flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--cream-2);border:1.5px solid var(--red);color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-top:1px;\">×<\u002Fspan>\n            {{ q }}\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SOLUÇÃO -->\n  <section style=\"padding:var(--section-y) 0;\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 32px;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;\">\n      <div>\n        <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Eyebrow\" hint-size=\"auto,18px\">Como funciona<\u002Fx-import>\n        <h2 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(28px,3.2vw,40px);margin:16px 0 18px;line-height:1.12;color:var(--ink);\">A gente monta a estrutura. <span style=\"color:var(--accent);\">Você entra e atende.<\u002Fspan><\u002Fh2>\n        <p style=\"font-size:16.5px;line-height:1.6;color:var(--ink-soft);margin:0 0 16px;\">Consultório equipado em região nobre — com tudo que uma profilaxia precisa. Café, água, internet e vaga também inclusos.<\u002Fp>\n        <p style=\"font-size:16.5px;line-height:1.6;color:var(--ink-soft);margin:0 0 16px;\">Você não aluga nada. Não assina contrato. Não investe nada antes de atender.<\u002Fp>\n        <p style=\"font-size:16.5px;line-height:1.6;color:var(--ink);font-weight:700;margin:0;\">Traz seu paciente, faz a profilaxia, paga R$170 pra clínica — e fica com o resto do que cobrar.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:var(--font-mono);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;\">Materiais inclusos<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;\">\n          <sc-for list=\"{{ solutionMaterials }}\" as=\"m\" hint-placeholder-count=\"12\">\n            <span style=\"display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--ink);border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;\">{{ m }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- BENEFÍCIOS -->\n  <section style=\"padding:var(--section-y) 0;background:var(--cream-2);\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 32px;\">\n      <div style=\"max-width:60ch;margin-bottom:44px;\">\n        <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Eyebrow\" hint-size=\"auto,18px\">O que você ganha<\u002Fx-import>\n        <h2 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(28px,3.2vw,40px);margin:14px 0 0;line-height:1.12;color:var(--ink);\">Não é só uma sala. É a sua primeira estrutura de verdade.<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px;\">\n        <sc-for list=\"{{ benefits }}\" as=\"b\" hint-placeholder-count=\"7\">\n          <div style=\"background:#fff;border:1.5px solid var(--ink);border-radius:18px;padding:28px 26px 30px;display:flex;flex-direction:column;gap:14px;\">\n            <div style=\"width:46px;height:46px;background:var(--accent);border:1.5px solid var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--navy);\">\n              <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Icon\" name=\"{{ b.icon }}\" size=\"22\" hint-size=\"22px,22px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <h4 style=\"font-family:var(--font-display);font-weight:700;font-size:19px;margin:0;color:var(--ink);\">{{ b.title }}<\u002Fh4>\n            <p style=\"margin:0;color:var(--ink-soft);font-size:14.5px;line-height:1.5;\">{{ b.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PROVA SOCIAL (sem depoimentos) -->\n  <section style=\"padding:var(--section-y) 0;\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 32px;\">\n      <div style=\"max-width:60ch;margin-bottom:36px;\">\n        <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Eyebrow\" hint-size=\"auto,18px\">O espaço<\u002Fx-import>\n        <h2 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(26px,3vw,34px);margin:14px 0 16px;line-height:1.15;color:var(--ink);\">Consultório equipado e pronto, em região nobre.<\u002Fh2>\n        <p style=\"font-size:16.5px;line-height:1.6;color:var(--ink-soft);margin:0;\">Pensado pra você atender com segurança desde o primeiro paciente — sem o improviso de quem está começando.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;\">\n        <sc-for list=\"{{ galleryPhotos }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div style=\"border:2px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:6px 6px 0 0 var(--ink);aspect-ratio:4/3;\">\n            <img src=\"{{ p.src }}\" alt=\"{{ p.alt }}\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- OFERTA -->\n  <section id=\"oferta\" style=\"padding:var(--section-y) 0;background:var(--cream-2);\">\n    <div style=\"max-width:880px;margin:0 auto;padding:0 32px;\">\n      <div style=\"border:2px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:8px 8px 0 0 var(--ink);background:#fff;\">\n        <div style=\"background:var(--navy);color:#fff;padding:32px 40px;\">\n          <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Eyebrow\" tone=\"light\" hint-size=\"auto,18px\"><span style=\"color:var(--accent);\">A oferta<\u002Fspan><\u002Fx-import>\n          <h3 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(24px,2.8vw,32px);margin:16px 0 0;max-width:24ch;\">Seu consultório pronto pra atender, sem risco.<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"padding:40px;\">\n          <ul style=\"list-style:none;margin:0 0 28px;padding:0;display:flex;flex-direction:column;gap:14px;\">\n            <sc-for list=\"{{ offerItems }}\" as=\"item\" hint-placeholder-count=\"5\">\n              <li style=\"display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding-bottom:14px;font-size:15.5px;color:var(--ink);\">\n                <span style=\"flex-shrink:0;width:22px;height:22px;background:var(--green);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;\">\n                  <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Icon\" name=\"check\" size=\"13\" hint-size=\"13px,13px\"><\u002Fx-import>\n                <\u002Fspan>\n                {{ item }}\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Ful>\n          <div style=\"background:var(--navy);color:#fff;border-radius:16px;padding:28px 24px;text-align:center;\">\n            <div style=\"font-family:var(--font-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.7);\">Você paga apenas<\u002Fdiv>\n            <div style=\"font-family:var(--font-display);font-weight:700;font-size:52px;line-height:1;color:var(--accent);margin-top:8px;\">R$ {{ priceDisplay }}<\u002Fdiv>\n            <div style=\"font-size:14px;color:rgba(255,255,255,.7);margin-top:6px;\">por profilaxia atendida<\u002Fdiv>\n            <div style=\"margin-top:14px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.55);\">Pix ou cartão de crédito (cartão com taxa de 5%)<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"text-align:center;margin:22px 0 0;color:var(--ink-soft);font-size:15px;\">Você cobra do seu paciente o valor que quiser. A diferença é sua.<\u002Fp>\n          <div style=\"display:flex;justify-content:center;margin-top:26px;\">\n            <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Button\" as=\"a\" href=\"#cadastro\" variant=\"accent\" size=\"xl\" icon=\"arrow\" hint-size=\"auto,60px\">Quero atender agora<\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- OBJEÇÕES -->\n  <section style=\"padding:var(--section-y) 0;\">\n    <div style=\"max-width:780px;margin:0 auto;padding:0 32px;\">\n      <div style=\"text-align:center;margin-bottom:36px;\">\n        <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Eyebrow\" hint-size=\"auto,18px\" style=\"justify-content:center;\">Sem essa<\u002Fx-import>\n        <h2 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(26px,3vw,34px);margin:14px 0 0;color:var(--ink);\">Bora resolver o que tá te travando<\u002Fh2>\n      <\u002Fdiv>\n      <sc-for list=\"{{ objections }}\" as=\"o\" hint-placeholder-count=\"5\">\n        <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Accordion\" question=\"{{ o.q }}\" hint-size=\"100%,64px\">{{ o.a }}<\u002Fx-import>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- GARANTIA -->\n  <section style=\"padding:56px 0;background:var(--navy);\">\n    <div style=\"max-width:780px;margin:0 auto;padding:0 32px;text-align:center;color:#fff;\">\n      <div style=\"width:56px;height:56px;border-radius:50%;background:var(--accent);border:2px solid #fff;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;\">\n        <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Icon\" name=\"lock\" size=\"26\" hint-size=\"26px,26px\" style=\"color:var(--navy)\"><\u002Fx-import>\n      <\u002Fdiv>\n      <h2 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(24px,2.8vw,32px);margin:0 0 14px;\">Sem contrato de fidelidade. Sem mensalidade.<\u002Fh2>\n      <p style=\"margin:0;color:rgba(255,255,255,.75);font-size:16.5px;line-height:1.6;max-width:56ch;margin:0 auto;\">Você só paga quando atende — R$ {{ priceDisplay }} por profilaxia, e nada além disso. Não usou no mês? Não deve nada.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FAQ -->\n  <section style=\"padding:var(--section-y) 0;background:var(--cream-2);\">\n    <div style=\"max-width:780px;margin:0 auto;padding:0 32px;\">\n      <div style=\"margin-bottom:36px;\">\n        <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Eyebrow\" hint-size=\"auto,18px\">Perguntas frequentes<\u002Fx-import>\n        <h2 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(26px,3vw,34px);margin:14px 0 0;color:var(--ink);\">Tudo que você precisa saber<\u002Fh2>\n      <\u002Fdiv>\n      <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"8\">\n        <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Accordion\" question=\"{{ f.q }}\" hint-size=\"100%,64px\">{{ f.a }}<\u002Fx-import>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CTA FINAL -->\n  <section style=\"padding:80px 0;background:var(--navy);color:#fff;text-align:center;position:relative;overflow:hidden;\">\n    <div style=\"position:absolute;inset:0;background-image:radial-gradient(circle at 50% 0%, rgba(63,182,255,.18), transparent 55%);pointer-events:none;\"><\u002Fdiv>\n    <div style=\"max-width:640px;margin:0 auto;padding:0 32px;position:relative;\">\n      <h2 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(28px,3.6vw,44px);margin:0 0 18px;line-height:1.15;\">Seu primeiro paciente não precisa esperar.<\u002Fh2>\n      <p style=\"margin:0 0 32px;color:rgba(255,255,255,.75);font-size:17px;\">O consultório já tá pronto — falta só você chegar.<\u002Fp>\n      <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Button\" as=\"a\" href=\"#cadastro\" variant=\"accent\" size=\"xl\" icon=\"arrow\" hint-size=\"auto,60px\">Quero atender agora<\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- PS -->\n  <section style=\"padding:56px 0;\">\n    <div style=\"max-width:680px;margin:0 auto;padding:0 32px;border-left:3px solid var(--accent);\">\n      <p style=\"margin:0;padding-left:22px;font-size:16px;line-height:1.65;color:var(--ink-soft);font-style:italic;\">\n        PS: Você não precisa de aluguel, contrato ou investimento pra atender seu primeiro paciente de profilaxia. Precisa só de um lugar pronto pra receber ele — e esse lugar já existe. Traz seu paciente e comece hoje.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"background:var(--navy);color:#fff;padding:56px 0 36px;border-top:1px solid var(--navy-line);\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 32px;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:end;\">\n      <div>\n        <div style=\"font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-0.02em;\">Reinvent <span style=\"color:var(--accent);\">Sorrisos<\u002Fspan><\u002Fdiv>\n        <p style=\"margin-top:14px;font-size:13.5px;color:rgba(255,255,255,.6);max-width:44ch;line-height:1.6;\">\n          Consultório completo pra dentistas recém-formados atenderem seus primeiros pacientes de profilaxia — sem aluguel, sem contrato.\n        <\u002Fp>\n        <a href=\"{{ whatsappHref }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:13.5px;color:rgba(255,255,255,.85);white-space:nowrap;\">\n          <x-import component-from-global-scope=\"STOPDesignSystem_4afb30.Icon\" name=\"whatsapp\" size=\"15\" hint-size=\"15px,15px\" style=\"color:var(--whatsapp)\"><\u002Fx-import>\n          {{ whatsappDisplay }}\n        <\u002Fa>\n      <\u002Fdiv>\n      <div style=\"text-align:right;font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.04em;\">\n        <div>© {{ year }} Reinvent Sorrisos<\u002Fdiv>\n        <div style=\"margin-top:6px;\">Dados tratados conforme a LGPD<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;price&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 170, &quot;tsType&quot;: &quot;number&quot;, &quot;min&quot;: 100, &quot;max&quot;: 400, &quot;step&quot;: 10, &quot;unit&quot;: &quot;R$&quot;}, &quot;whatsappNumber&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;(11) 90000-0000&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contato&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    name: \"\",\n    whatsapp: \"\",\n    cro: \"\",\n    consent: false,\n    submitted: false,\n    sending: false,\n    sendError: false,\n  };\n\n  handleSubmit = async (e) => {\n    e.preventDefault();\n    if (!this.state.name || !this.state.whatsapp || !this.state.consent) return;\n    this.setState({ sending: true, sendError: false });\n    try {\n      const res = await fetch(\"https://formsubmit.co/ajax/drmauriciocastello@gmail.com\", {\n        method: \"POST\",\n        headers: { \"Content-Type\": \"application/json\", Accept: \"application/json\" },\n        body: JSON.stringify({\n          _subject: \"Novo cadastro — Reinvent Sorrisos\",\n          Nome: this.state.name,\n          WhatsApp: this.state.whatsapp,\n          \"Já deu entrada no CRO\": this.state.cro === \"sim\" ? \"Sim\" : \"Ainda não\",\n        }),\n      });\n      if (!res.ok) throw new Error(\"HTTP \" + res.status);\n      this.setState({ submitted: true, sending: false });\n    } catch (err) {\n      this.setState({ sending: false, sendError: true });\n    }\n  };\n\n  renderVals() {\n    const price = this.props.price ?? 170;\n    const whatsappNumber = this.props.whatsappNumber ?? \"(11) 90000-0000\";\n    const digits = whatsappNumber.replace(/\\D/g, \"\");\n\n    const tickerItems = [\n      \"SEM ALUGUEL FIXO\", \"SEM CONTRATO\", \"PAGUE SÓ QUANDO ATENDER\",\n      \"ESTRUTURA COMPLETA\", \"LOCALIZAÇÃO NOBRE\", \"MATERIAIS INCLUSOS\",\n    ];\n\n    const painQuestions = [\n      \"Você já se pegou pensando “onde eu atendo meu primeiro paciente”?\",\n      \"Já calculou quanto custaria montar um consultório do zero e desistiu na hora?\",\n      \"Já sentiu que clínica popular não é o seu lugar, mas também não tem como pagar sala particular?\",\n      \"Já teve paciente querendo marcar e você não teve onde atender?\",\n      \"Cansou de esperar “a oportunidade certa” aparecer?\",\n    ];\n\n    const solutionMaterials = [\n      \"Pasta profilática\", \"Escovas\", \"Taças de borracha\", \"Material estéril\",\n      \"Bicarbonato\", \"Ultrassom\", \"Pontas\", \"Papel\", \"Enxaguante\",\n      \"Café\", \"Água\", \"Internet\", \"Vaga\",\n    ];\n\n    const benefits = [\n      { icon: \"coin\", title: \"Zero investimento inicial\", body: \"Você começa a atender sem tirar 1 real do bolso pra montar estrutura.\" },\n      { icon: \"spark\", title: \"Atendimento no mesmo dia\", body: \"Assim que seu paciente estiver pronto, você já tem onde atender.\" },\n      { icon: \"check\", title: \"Sem mensalidade, sem multa\", body: \"Paga só quando usa. Se não atender no mês, não deve nada.\" },\n      { icon: \"kit\", title: \"Estrutura completa, sem improviso\", body: \"Materiais estéreis e equipamento profissional, do jeito que você aprendeu na faculdade.\" },\n      { icon: \"brand\", title: \"Localização nobre\", body: \"Leva seu paciente pra um endereço que passa confiança, sem precisar explicar nada.\" },\n      { icon: \"chart\", title: \"Você define seu próprio preço\", body: \"A clínica fica só com R$170; o que você cobrar a mais é seu.\" },\n      { icon: \"grow\", title: \"Primeira experiência profissional de verdade\", body: \"Sem depender de vaga de emprego ou sociedade em clínica popular.\" },\n    ];\n\n    const offerItems = [\n      \"Consultório completo e equipado\",\n      \"Todos os materiais da profilaxia inclusos\",\n      \"Localização nobre, com vaga\",\n      \"Café, água e internet\",\n      \"Sem mensalidade, sem contrato\",\n    ];\n\n    const res = (window.__resources || {});\n    const galleryPhotos = [\n      { src: res.imgFachada || \"assets/opt-consultorio-fachada.webp\", alt: \"Fachada do consultório\" },\n      { src: res.imgRecepcao || \"assets/opt-consultorio-recepcao.webp\", alt: \"Recepção do consultório\" },\n      { src: res.imgLounge || \"assets/opt-consultorio-lounge1.webp\", alt: \"Sala de espera\" },\n      { src: res.imgCadeira || \"assets/opt-consultorio-cadeira1.webp\", alt: \"Sala de atendimento equipada\" },\n      { src: res.imgConsultorio || \"assets/opt-consultorio-consultorio.webp\", alt: \"Consultório com estrutura completa\" },\n      { src: res.imgJardim || \"assets/opt-consultorio-jardim.webp\", alt: \"Jardim interno do consultório\" },\n    ];\n\n    const objections = [\n      { q: \"“Não tenho como montar um consultório.”\", a: \"Você não precisa montar nada. A estrutura já existe, pronta, equipada. Você só chega e atende.\" },\n      { q: \"“Não tenho como investir em aluguel de sala.”\", a: \"Aqui não tem aluguel. Você paga R$\" + price + \" só quando atende — sem atendimento, sem cobrança.\" },\n      { q: \"“Não tenho pacientes recorrentes que justifiquem pagar uma sala fixa.”\", a: \"Por isso não pedimos compromisso fixo. Você usa quando tem paciente, do jeito que sua agenda permitir.\" },\n      { q: \"“Não quero entrar em clínica popular.”\", a: \"Não é isso. É um consultório particular, em região nobre, pra você atender do seu jeito, com seu próprio preço.\" },\n      { q: \"“Não tenho nenhum tipo de oportunidade ainda.”\", a: \"Essa é a oportunidade: seu primeiro consultório, sem precisar de currículo, sociedade ou investimento.\" },\n    ];\n\n    const faqs = [\n      { q: \"Preciso pagar alguma taxa pra começar?\", a: \"Não. Você só paga R$\" + price + \" no dia em que atender um paciente.\" },\n      { q: \"Serve pra quem acabou de se formar?\", a: \"Sim — é exatamente pra isso. Feito pra dentista recém-formado que ainda não tem consultório.\" },\n      { q: \"E se eu não tiver paciente todo mês?\", a: \"Sem problema. Você usa o consultório só quando tiver paciente marcado. Não tem mensalidade.\" },\n      { q: \"O que já vem incluso no atendimento?\", a: \"Todo o material da profilaxia: pasta profilática, escovas, taças de borracha, material estéril, bicarbonato, ultrassom, pontas, papel e enxaguante.\" },\n      { q: \"Preciso levar algum equipamento?\", a: \"Não. Só o seu paciente.\" },\n      { q: \"Quanto tempo dura o atendimento?\", a: \"Uma hora, o suficiente pra fazer a profilaxia com calma.\" },\n      { q: \"Como funciona o pagamento?\", a: \"Pix ou cartão de crédito. No cartão incide taxa de 5%.\" },\n      { q: \"Como eu agendo o horário do consultório?\", a: \"Pelo WhatsApp — depois do cadastro, a gente combina com você o melhor horário direto por lá.\" },\n    ];\n\n    const croBtn = (value, label) => ({\n      value,\n      label,\n      select: () => this.setState({ cro: value }),\n      bg: this.state.cro === value ? \"var(--accent)\" : \"#fff\",\n      color: this.state.cro === value ? \"var(--navy)\" : \"var(--ink)\",\n    });\n\n    return {\n      whatsappHref: \"https://wa.me/55\" + digits,\n      whatsappDisplay: whatsappNumber,\n      priceDisplay: String(price).replace(\".\", \",\"),\n      year: new Date().getFullYear(),\n      tickerItems2x: [...tickerItems, ...tickerItems],\n      painQuestions,\n      solutionMaterials,\n      benefits,\n      galleryPhotos,\n      offerItems,\n      objections,\n      faqs,\n      name: this.state.name,\n      whatsapp: this.state.whatsapp,\n      consent: this.state.consent,\n      submitted: this.state.submitted,\n      notSubmitted: !this.state.submitted,\n      sending: this.state.sending,\n      sendError: this.state.sendError,\n      submitLabel: this.state.sending ? \"Enviando…\" : \"Quero atender agora\",\n      onNameChange: (e) => this.setState({ name: e.target.value }),\n      onWhatsappChange: (e) => this.setState({ whatsapp: e.target.value }),\n      onConsentChange: (e) => this.setState({ consent: e.target.checked }),\n      handleSubmit: this.handleSubmit,\n      croOptions: [croBtn(\"sim\", \"Sim\"), croBtn(\"nao\", \"Ainda não\")],\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
